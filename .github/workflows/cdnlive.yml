name: CDN Live TV M3U Güncelle

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Bağımlılıkları yükle
        run: |
          python -m pip install --upgrade pip
          pip install requests urllib3

      - name: M3U oluştur
        run: |
          python checker.py

      - name: Debug artifact yükle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cdnlive-debug
          path: |
            cdnlive.m3u
            debug_failed.json
            debug_samples
          if-no-files-found: ignore

      - name: Commit ve push
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add cdnlive.m3u debug_failed.json || true

          if git diff --cached --quiet; then
            echo "Değişiklik yok."
          else
            git commit -m "cdnlive.m3u guncellendi"
            git push
          fi
