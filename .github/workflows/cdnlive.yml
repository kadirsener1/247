name: CDN Live TV M3U Güncelle

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Python paketleri
        run: |
          pip install --upgrade pip
          pip install requests urllib3 playwright

      - name: Playwright Chromium kur
        run: |
          python -m playwright install chromium --with-deps

      - name: M3U oluştur
        run: python checker.py

      - name: Artifact yükle (debug)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cdnlive-debug
          path: |
            cdnlive.m3u
            debug_failed.json
          if-no-files-found: ignore

      - name: Commit ve push
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add cdnlive.m3u debug_failed.json || true

          if git diff --cached --quiet; then
            echo "ℹ️ Değişiklik yok."
          else
            KANAL=$(grep -c '^#EXTINF' cdnlive.m3u 2>/dev/null || echo 0)
            TARIH=$(TZ='Europe/Istanbul' date '+%d.%m.%Y %H:%M')
            git commit -m "📺 $KANAL kanal — $TARIH"
            git push
          fi
