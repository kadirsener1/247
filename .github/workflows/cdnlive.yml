name: 📺 cdnlive M3U Playlist Güncelle

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["generator.py", "config.json"]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    name: 🔄 Güncelle

    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      
      - name: 📦 Bağımlılıklar
        run: pip install requests

        - name: 🚀 Generator Çalıştır
        run: python generator.py
        timeout-minutes: 12

      - name: 📋 Sonuç
        run: |
          if [ -f "cdnlive.m3u" ]; then
            KANAL=$(grep -c "^#EXTINF" cdnlive.m3u || echo "0")
            BOYUT=$(du -h cdnlive.m3u | cut -f1)
            echo "✅ $KANAL kanal | $BOYUT"
            echo ""
            echo "İlk 10 kanal:"
            grep "^#EXTINF" cdnlive.m3u | head -10 | sed 's/.*,/  📺 /'
          else
            echo "❌ Dosya oluşturulamadı"
            exit 1
          fi

      - name: 📤 Commit & Push
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add cdnlive.m3u config.json README.md 2>/dev/null || true
          if ! git diff --staged --quiet; then
            KANAL=$(grep -c "^#EXTINF" cdnlive.m3u 2>/dev/null || echo "0")
            git commit -m "📺 $KANAL kanal güncellendi | $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          else
            echo "Değişiklik yok"
          fi
