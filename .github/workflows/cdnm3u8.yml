name: CDN Live TV M3U Güncelle son son

on:
  workflow_dispatch:
  schedule:
    # Her 3 saatte bir otomatik çalışır
    - cron: '0 */3 * * *'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Depoyu Klonla (Checkout)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python 3.12 Kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Gerekli Paketleri Yükle
        run: |
          python -m pip install --upgrade pip
          pip install requests urllib3 playwright

      - name: Playwright Chromium Kurulumu
        run: |
          python -m playwright install chromium --with-deps

      - name: M3U Dosyalarını Oluştur ve Senkronize Et
        env:
          DISPLAY: ""
          LIBGL_ALWAYS_SOFTWARE: "1"
          GALLIUM_DRIVER: "softpipe"
        run: |
          # Python script dosyanızın adı 'checker.py' değilse burayı dosya adınızla değiştirin
          python checker.py

      - name: Yedekleri Artifact Olarak Yükle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cdn-m3u-ve-debug
          path: |
            cdn.m3u
            playlist.m3u
            debug_failed.json
          if-no-files-found: ignore

      - name: Değişiklikleri Kaydet ve Gönder (Commit & Push)
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Olası uzak sunucu değişikliklerini çek (çakışmaları önlemek için)
          git pull --rebase origin main || true

          # Varsa eski klasörü temizle
          git rm -rf cdnlive 2>/dev/null || true
          
          # Güncellenen dosyaları git'e ekle
          git add cdn.m3u playlist.m3u debug_failed.json || true

          # Değişiklik kontrolü
          if git diff --cached --quiet; then
            echo "ℹ️ Herhangi bir değişiklik tespit edilmedi, commit atlanıyor."
          else
            KANAL=$(grep -c "#EXTINF" cdn.m3u 2>/dev/null || echo 0)
            TARIH=$(TZ='Europe/Istanbul' date '+%d.%m.%Y %H:%M')
            git commit -m "📺 $KANAL kanal güncellendi — $TARIH"
            git push origin main
          fi
