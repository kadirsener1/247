name: CDN Live TV M3U Güncelle son

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */3 * * *'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Depoyu Klonla (Checkout)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python 3.12 Kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Gerekli Paketleri Yükle
        run: |
          python -m pip install --upgrade pip
          pip install requests urllib3 playwright

      - name: Playwright Chromium Kurulumu
        run: |
          python -m playwright install chromium --with-deps

      - name: playlist.m3u Dosyasını Güncelle
        env:
          DISPLAY: ""
          LIBGL_ALWAYS_SOFTWARE: "1"
          GALLIUM_DRIVER: "softpipe"
        run: |
          python checker.py

      - name: Hata Günlüğünü Artifact Olarak Kaydet
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-failed-ve-playlist
          path: |
            playlist.m3u
            debug_failed.json
          if-no-files-found: ignore

      - name: Değişiklikleri Commit et ve Pushla
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Olası çakışmaları önlemek için uzak sunucu değişikliklerini rebase ile çek
          git pull --rebase origin main || true

          # Sadece değişen playlist.m3u ve hata günlüğünü git'e ekle
          git add playlist.m3u debug_failed.json || true

          # Değişiklik kontrolü
          if git diff --cached --quiet; then
            echo "ℹ️ Değişiklik yok. Commit atlanıyor."
          else
            TARIH=$(TZ='Europe/Istanbul' date '+%d.%m.%Y %H:%M')
            git commit -m "📺 playlist.m3u kanalları güncellendi — $TARIH"
            git push origin main
          fi
