name: LiveLive24 M3U Auto Updater

on:
  schedule:
    # Her 6 saatte bir otomatik çalışır (Saatleri dilediğiniz gibi ayarlayabilirsiniz)
    - cron: '0 */6 * * *'
  workflow_dispatch:
    # GitHub paneli üzerinden manuel tetikleme butonu ekler

permissions:
  contents: write # Dosyaları repoya geri yazabilmesi için izin tanımlıyoruz

jobs:
  update-m3u:
    runs-on: ubuntu-latest

    steps:
      # 1. Depodaki kodları çek
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Python Ortamını Kur
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip' # Pip cache kullanarak sonraki çalışmaları hızlandırır

      # 3. Gerekli Kütüphaneleri Yükle
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests playwright

      # 4. Playwright Tarayıcısını ve Gerekli Sistem Bileşenlerini Kur
      - name: Install Playwright Chromium
        run: |
          playwright install chromium
          playwright install-deps chromium

      # 5. Python Betiğini Çalıştır
      - name: Run Updater Script
        run: python livetv.py # Python dosyanızın adı farklıysa burayı güncelleyin

      # 6. Değişen Dosyaları GitHub Deposuna Geri Yükle (Push)
      - name: Commit and Push Changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          # Sadece değişen m3u ve log dosyalarını ekle
          git add livelive24.m3u playlist.m3u debug_failed.json || true
          
          # Eğer değişiklik varsa commit yap ve pushla
          if ! git diff --cached --quiet; then
            git commit -m "Auto-Update: M3U Playlists [$(date -u +'%Y-%m-%d %H:%M:%S') UTC]"
            git push
            echo "✅ Playlist başarıyla güncellendi ve GitHub'a yüklendi."
          else
            echo "⏭️ Herhangi bir değişiklik tespit edilmedi, commit atlanıyor."
          fi
