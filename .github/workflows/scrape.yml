name: SportsBite Scraper

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scraper.py']

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Bağımlılıkları yükle
        run: pip install -r requirements.txt

      - name: Scraper çalıştır
        run: python scraper.py

      - name: Commit & Push
        run: |
          git config user.email "bot@github.com"
          git config user.name "bot"
          git add tv247.m3u
          git diff --staged --quiet || git commit -m "🔄 M3U güncellendi $(date -u '+%H:%M UTC')"
          git push
