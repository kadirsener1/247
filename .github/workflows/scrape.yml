name: SportsBite Scraper

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Bağımlılıkları yükle
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests
          python -m pip install beautifulsoup4
          python -m pip install cloudscraper
          python -m pip list

      - name: Python ve modül kontrol
        run: |
          python --version
          python -c "import cloudscraper; print('cloudscraper OK')"
          python -c "import bs4; print('beautifulsoup4 OK')"
          python -c "import requests; print('requests OK')"

      - name: Scraper çalıştır
        run: python scraper.py

      - name: Sonucu göster
        run: cat tv247.m3u || echo "Dosya yok"

      - name: Commit ve Push
        run: |
          git config user.email "bot@github.com"
          git config user.name "bot"
          git add -A
          git diff --staged --quiet || git commit -m "M3U güncellendi"
          git push
