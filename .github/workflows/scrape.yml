name: SportsBite Scraper

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Bağımlılıkları yükle
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests beautifulsoup4 cloudscraper
          python -c "import cloudscraper; print('OK')"

      - name: Scraper çalıştır
        run: python scraper_bite.py

      - name: Kanal sayısını göster
        run: |
          echo "Toplam kanal: $(grep -c '#EXTINF' tv247_bite.m3u)"
          echo "m3u8 stream: $(grep -c '.m3u8' tv247_bite.m3u)"
          head -30 tv247_bite.m3u

      - name: Commit ve Push
        run: |
          git config user.email "bot@github.com"
          git config user.name "bot"
          git add -A
          git diff --staged --quiet || git commit -m "M3U güncellendi - $(grep -c '#EXTINF' tv247.m3u) kanal"
          git push
