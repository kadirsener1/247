name: SportsBite Stream Finder

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🐍 Python Kurulum
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Bağımlılıkları Yükle
        run: |
          pip install --upgrade pip
          pip install requests beautifulsoup4 cloudscraper lxml

      - name: 🔍 Scraper Çalıştır
        run: python scraper.py

      - name: 📋 Sonuçları Göster
        run: |
          echo "=== tv247.m3u ==="
          cat tv247.m3u || echo "Dosya yok"

      - name: 📤 Commit & Push
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git add -A
          git diff --staged --quiet || git commit -m "🔄 Güncellendi - $(date +'%Y-%m-%d %H:%M UTC')"
          git push
