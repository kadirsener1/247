name: Update tv247 world Playlist s1 s2

on:
  # Her 2 saatte bir çalışsın
  schedule:
    - cron: '0 */2 * * *'

  # Manuel tetikleme
  workflow_dispatch:

  # Kod değişikliğinde
  push:
    branches:
      - main
    paths:
      - 'scraper.py'
      - 'channels.txt'

concurrency:
  group: update-m3u
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  update-playlist:
    runs-on: ubuntu-22.04
    timeout-minutes: 20

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests playwright

      - name: 🌐 Install Playwright Chromium & System Dependencies
        run: |
          playwright install chromium --with-deps

      - name: 🔍 Run scraper
        run: python scraper.py
        env:
          PYTHONUNBUFFERED: "1"

      - name: 📤 Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # Oluşturulan tvnow247 klasörünü ve tüm güncellenen dosyaları Git'e ekle
          git add -A
          
          if git diff --cached --quiet; then
            echo "Değişiklik yok"
          else
            TIMESTAMP=$(date -u '+%Y-%m-%d %H:%M UTC')
            git commit -m "🔄 Update playlist | ${TIMESTAMP}"
            git push
          fi
